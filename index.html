<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Кодировка и адаптивность для мобильных устройств (NFR-11) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Lights Out</title>
    
    <!-- Подключение внешних стилей -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- [FR-1 / UI-5]: Если JavaScript отключен, скрываем Canvas, 
    так как игра не сможет работать без скриптов -->
    <noscript><style>.board-canvas { display: none; }</style></noscript>
</head>
<body>
    <div class="page">
        <!-- Основной контейнер игры -->
        <main class="game" aria-label="Игра Lights Out">
            
            <!-- Верхняя панель: Заголовок слева, кнопки размеров справа -->
            <!-- [UI-4]: Заголовок и подзаголовок игры -->
            <div class="top">
                <div class="titles">
                    <h1>Lights Out</h1>
                    <div class="subtitle">Погасите все клетки</div>
                </div>
                
                <div class="size-selector">
                    <button type="button" class="size-btn" data-size="3">3×3</button>
                    <button type="button" class="size-btn active" data-size="5">5×5</button>
                    <button type="button" class="size-btn" data-size="7">7×7</button>
                </div>
            </div>

            <!-- Полоса метрик: Уровень, Ходы, Очки, Рекорд -->
            <div class="metrics">
                <div class="metric">
                    <div class="label">Уровень</div>
                    <div class="value"><span id="current-level">1</span>/<span id="max-level">15</span></div>
                </div>
                <div class="divider"></div>
                
                <div class="metric">
                    <div class="label">Ходы</div>
                    <div class="value" id="moves-value">0</div>
                </div>
                <div class="divider"></div>
                
                <div class="metric">
                    <div class="label">Очки</div>
                    <div class="value yellow" id="score-value">0</div>
                </div>
                <div class="divider"></div>
                
                <div class="metric">
                    <div class="label">Рекорд</div>
                    <div class="value" id="highscore-value">0</div>
                </div>
            </div>

            <!-- [UI-1 / FR-1]: Игровое поле на Canvas
                 id="board" — точка привязки для BoardRenderer и BoardInput -->
            <div class="field-area">
                <canvas id="board" width="400" height="400" class="board-canvas" role="img" aria-label="Игровое поле"></canvas>
                
                <!-- [UI-5 / FR-1]: Статическое сообщение об ошибке при отключенном JS -->
                <noscript>
                    <div class="error-fallback" role="alert">Для игры необходимо включить JavaScript</div>
                </noscript>
            </div>

            <!-- [UI-6 / FR-13]: Слот для сообщения о победе. По умолчанию скрыт атрибутом hidden -->
            <div class="status-slot" aria-live="polite">
                <span class="win-message" id="win-message" hidden>Вы победили!</span>
            </div>

            <!-- Кнопка перезапуска текущего уровня (главная, фиолетовая)-->
            <button class="restart" id="restart-level-button" type="button">
                Перезапустить уровень
            </button>
            
             <!-- [UI-3 / FR-11 / FR-12]: Кнопка перезапуска игры (второстепенная, прозрачная)-->
            <button class="restart restart-game-btn" id="restart-button" type="button">
                Перезапустить игру
            </button>

        </main>
    </div>

    <!-- Архитектура ES-модулей: подключаем только main.js, 
         который через import свяжет все остальные классы -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
